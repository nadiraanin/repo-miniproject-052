<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mini Project Azure Serverless - Nadira</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 450px; }
        h2 { color: #1f4e79; text-align: center; margin-bottom: 5px; }
        .info { text-align: center; font-size: 0.9em; color: #666; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .services { background: #f9f9f9; padding: 10px; border-radius: 8px; font-size: 0.8em; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #1f4e79; color: white; border: none; cursor: pointer; font-weight: bold; }
        #hasil { margin-top: 20px; padding: 15px; background: #e8f4fd; border-radius: 8px; display: none; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Estimasi Biaya Konsumsi</h2>
        <div class="info">
            <strong>Nadira Anindita - 0920240052</strong><br>
            Praktikum Komputasi Awan - Azure Serverless
        </div>

        <div class="services">
            <strong>Layanan Azure yang digunakan:</strong>
            <ul>
                <li>Azure Static Web Apps (Frontend)</li>
                <li>Azure Functions (API Backend)</li>
                <li>Azure App Service (Dynamic Web)</li>
                <li>Azure Container Apps (Microservices)</li>
            </ul>
        </div>

        <input type="number" id="jumlah" placeholder="Masukkan Jumlah Peserta">
        <select id="jenis">
            <option value="snack">Snack (Rp15.000)</option>
            <option value="makan">Makan (Rp30.000)</option>
            <option value="lengkap">Lengkap (Rp45.000)</option>
        </select>
        <button onclick="hitung()">HITUNG ESTIMASI</button>

        <div id="hasil">
            <strong style="color: #1f4e79;">JSON Response:</strong>
            <pre id="jsonContent" style="white-space: pre-wrap; margin-top: 10px;"></pre>
        </div>
    </div>

    <script>
        async function hitung() {
            const jml = document.getElementById('jumlah').value;
            const jns = document.getElementById('jenis').value;
            const url = `https://func-serverless-052-e2d7bddubydhfjgz.eastasia-01.azurewebsites.net/api/KalkulatorBiaya?jumlah=${jml}&jenis=${jns}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('hasil').style.display = 'block';
                document.getElementById('jsonContent').innerText = JSON.stringify(data, null, 2);
            } catch (e) { alert("Cek kembali settingan CORS di Azure Function!"); }
        }
    </script>
</body>
</html>
